name: Build Naipe Logger

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Versões fixas: `@latest` tornava o build irreprodutível e dependente do que
# estivesse publicado no dia. WAILS_VERSION deve acompanhar go.mod.
env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.10.1'

permissions:
  contents: read

jobs:
  verify:
    name: Verificação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt
        run: |
          unformatted=$(gofmt -l backend/ main.go)
          if [ -n "$unformatted" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Verificar go.mod atualizado
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Em tags vX.Y.Z a versão do binário e do instalador vem da tag.
      - name: Injetar versão da tag em wails.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME inválida: use vX.Y.Z (o Windows e o NSIS exigem versão numérica)."
            exit 1
          fi
          VERSION="$VERSION" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("wails.json","utf8"));j.info.productVersion=process.env.VERSION;fs.writeFileSync("wails.json",JSON.stringify(j,null,2)+"\n");console.log("productVersion =",j.info.productVersion)'

      # `wails build -nsis` chama o makensis, que precisa estar no PATH.
      - name: Garantir NSIS no PATH
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) { exit 0 }
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            choco install nsis -y --no-progress
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Build Windows with NSIS
        run: wails build -platform windows/amd64 -nsis

      # teamwork-logger.exe (portátil) e TeamworkLogger-amd64-installer.exe
      # (instalador por usuário, gerado a partir de build/windows/installer).
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: naipe-logger-windows
          if-no-files-found: error
          path: |
            build/bin/teamwork-logger.exe
            build/bin/*-installer.exe

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # O Ubuntu 24.04 só traz o WebKitGTK 4.1; o Wails o usa com a build tag
      # webkit2_41 (sem symlink fingindo ser o 4.0).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Injetar versão da tag em wails.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME inválida: use vX.Y.Z."
            exit 1
          fi
          VERSION="$VERSION" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("wails.json","utf8"));j.info.productVersion=process.env.VERSION;fs.writeFileSync("wails.json",JSON.stringify(j,null,2)+"\n");console.log("productVersion =",j.info.productVersion)'

      - name: Build Linux
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Create AppImage
        run: |
          echo "=== Files in build/bin/ ==="
          ls -la build/bin/

          # Download AppImageTool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          # Create AppImage directory structure
          mkdir -p NaipeLogger.AppDir/usr/bin
          mkdir -p NaipeLogger.AppDir/usr/share/applications
          mkdir -p NaipeLogger.AppDir/usr/share/pixmaps

          # Find the actual binary name and copy it
          BINARY_NAME=$(ls build/bin/ | grep -v "\.exe$" | head -n 1)
          echo "Found binary: $BINARY_NAME"
          cp build/bin/$BINARY_NAME NaipeLogger.AppDir/usr/bin/naipe-logger
          chmod +x NaipeLogger.AppDir/usr/bin/naipe-logger

          # Use the real app icon instead of a generated placeholder
          sudo apt-get install -y imagemagick
          convert build/appicon.png -resize 256x256 NaipeLogger.AppDir/naipe-logger.png

          # Create desktop file with proper formatting
          cat > NaipeLogger.AppDir/naipe-logger.desktop << 'DESKTOP_EOF'
          [Desktop Entry]
          Type=Application
          Name=Naipe Logger
          Exec=naipe-logger
          Icon=naipe-logger
          Categories=Office;ProjectManagement;
          Comment=Teamwork Time Logger Application
          StartupNotify=true
          DESKTOP_EOF

          cp NaipeLogger.AppDir/naipe-logger.desktop NaipeLogger.AppDir/usr/share/applications/

          # Create AppRun script
          cat > NaipeLogger.AppDir/AppRun << 'APPRUN_EOF'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "$APPDIR/usr/bin/naipe-logger" "$@"
          APPRUN_EOF
          chmod +x NaipeLogger.AppDir/AppRun

          # Create the AppImage using --appimage-extract-and-run to bypass FUSE requirement
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run NaipeLogger.AppDir naipe-logger-linux.AppImage

          echo "=== Final files created ==="
          ls -la naipe-logger-linux.AppImage build/bin/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: naipe-logger-linux
          path: |
            build/bin/*
            naipe-logger-linux.AppImage

  build-macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Injetar versão da tag em wails.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME inválida: use vX.Y.Z."
            exit 1
          fi
          VERSION="$VERSION" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("wails.json","utf8"));j.info.productVersion=process.env.VERSION;fs.writeFileSync("wails.json",JSON.stringify(j,null,2)+"\n");console.log("productVersion =",j.info.productVersion)'

      - name: Build macOS Universal Binary
        run: wails build -platform darwin/universal

      - name: Create DMG
        run: |
          echo "=== Files in build/bin/ ==="
          ls -la build/bin/

          APP_NAME=$(ls build/bin/ | grep "\.app$" | head -n 1)

          if [ -n "$APP_NAME" ]; then
            echo "Found app bundle: $APP_NAME"
            mkdir -p dmg-temp
            cp -R "build/bin/$APP_NAME" dmg-temp/
            hdiutil create -volname "Naipe Logger" -srcfolder dmg-temp -ov -format UDZO naipe-logger-macos.dmg
            rm -rf dmg-temp
            echo "=== DMG created successfully ==="
            ls -la naipe-logger-macos.dmg
          else
            echo "No .app bundle found, skipping DMG creation"
          fi

      - name: Zip .app for direct download option
        run: |
          APP_NAME=$(ls build/bin/ | grep "\.app$" | head -n 1)
          if [ -n "$APP_NAME" ]; then
            cd build/bin/
            zip -r "../../naipe-logger-macos.app.zip" "$APP_NAME"
            cd ../..
            echo "=== .app zip created ==="
            ls -la naipe-logger-macos.app.zip
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: naipe-logger-macos
          path: |
            naipe-logger-macos.dmg
            naipe-logger-macos.app.zip

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: naipe-logger-windows
          path: ./windows/

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: naipe-logger-linux
          path: ./linux/

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: naipe-logger-macos
          path: ./macos/

      - name: Gerar checksums
        run: |
          echo "=== Arquivos baixados ==="
          ls -laR ./windows/ ./linux/ ./macos/
          sha256sum windows/teamwork-logger.exe windows/*-installer.exe linux/naipe-logger-linux.AppImage macos/*.dmg macos/*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Naipe Logger ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            windows/teamwork-logger.exe
            windows/*-installer.exe
            linux/naipe-logger-linux.AppImage
            macos/*.dmg
            macos/*.zip
            SHA256SUMS.txt
