# Atualizações automáticas de dependências. Semanal e com minor/patch
# agrupados num único PR por ecossistema, para não afogar o repositório em PRs
# pequenos; majors chegam separados porque costumam exigir mudança de código.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # As actions estão fixadas por SHA no build.yml; o Dependabot atualiza o SHA
  # e o comentário de versão juntos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
