# Atualizações automáticas de dependências. Semanal e com minor/patch
# agrupados num único PR por ecossistema, para não afogar o repositório em PRs
# pequenos; majors chegam separados porque costumam exigir mudança de código.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A versão do Wails no go.mod precisa bater com WAILS_VERSION do CI e
      # com a CLI local; atualizar só o go.mod quebra o build. É mudança
      # coordenada, feita à mão.
      - dependency-name: "github.com/wailsapp/wails/v2"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Majors que exigem migração de configuração ou esperam o ecossistema
      # (plugins do ESLint, typescript-eslint) acompanhar. Saem daqui quando
      # a migração for planejada.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Os tipos acompanham o Node usado de fato (NODE_VERSION do CI, hoje 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # As actions estão fixadas por SHA no build.yml; o Dependabot atualiza o SHA
  # e o comentário de versão juntos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
